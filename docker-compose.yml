services:
  postgres:
    image: postgres:16-alpine
    container_name: mediajet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediajet
      POSTGRES_PASSWORD: mediajet
      POSTGRES_DB: mediajet
    ports:
      - "5432:5432"
    volumes:
      - mediajet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediajet -d mediajet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mediajet_pgdata:
