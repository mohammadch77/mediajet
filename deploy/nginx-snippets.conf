# ─── گت‌استوک: تکه‌های nginx برای حالت به‌روزرسانی و محافظت از source map ───
# داخل بلوک server { ... } سایت (443) قرار بده، قبل از location / که به Node پروکسی می‌کند.
# مسیر /var/www را در صورت نیاز با مسیر برنامه عوض کن (باید همان محل maintenance.flag و public/ باشد).

# ۱) source mapها هرگز عمومی نیستند (فقط خود برنامه‌ی Node آن‌ها را از دیسک می‌خواند)
location ~* \.map$ { return 404; }

# ۲) صفحه‌ی ثابت به‌روزرسانی؛ مستقل از Node
location = /maintenance.html {
    root /var/www/public;
    internal;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 120 always;
    add_header X-Maintenance 1 always;
}

# ۳) خطای سرور (برنامه پایین است یا بالا نیامده) → همان صفحه
error_page 502 503 504 =503 /maintenance.html;

# ۴) حالت دستی: اگر فایل پرچم وجود داشت، به‌جز مسیرهای مستثنا همه‌چیز ۵۰۳ می‌شود
set $mj_maint 0;
if (-f /var/www/maintenance.flag) { set $mj_maint 1; }
# مستثنا: پنل ادمین و ورود، فایل‌های استاتیک، بازگشت درگاه پرداخت، وبهوک تلگرام، ثبت خطا
if ($uri ~ ^/(admin|_next|api/admin|api/auth|api/orders/payment/callback|api/wallet/charge/callback|api/payments|api/telegram|api/client-errors)) { set $mj_maint 0; }
if ($mj_maint = 1) { return 503; }
